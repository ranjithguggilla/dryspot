[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dryspot"
version = "0.1.0"
description = "Rank African water points by the chance they are dry on the next visit, with validation that respects geography."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ranjith Guggilla" }]
dependencies = [
  "pandas>=3.0",
  "numpy>=2.0",
  "scikit-learn>=1.8",
  "h3>=4.0",
  "folium>=0.20",
  "crepes>=0.9",
  "matplotlib>=3.9",
  "scipy>=1.14",
  "joblib>=1.4",
  "pyarrow>=17",
  "gradio>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
dryspot = "dryspot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
